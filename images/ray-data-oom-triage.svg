<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-label="OOM 排查：确认故障层 → 定位来源 → 控制变量复测">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1100" height="820" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">OOM 排查：确认故障层 → 定位来源 → 控制变量复测</text>
<rect x="80" y="90" width="940" height="90" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="100" y="123" font-size="21" font-weight="700" fill="#0f172a">① 确认错误与终止原因</text>
<text x="100" y="155" font-size="17" fill="#475569">Ray 主动终止 / OOMKilled / MemoryError / 对象或磁盘错误</text>
<path d="M550 180V200" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="205" width="940" height="90" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="100" y="238" font-size="21" font-weight="700" fill="#0f172a">② 对齐内存指标与时间线</text>
<text x="100" y="270" font-size="17" fill="#475569">Node、容器、Worker 私有内存、Object Store、Spilling</text>
<path d="M550 295V315" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="320" width="940" height="90" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="100" y="353" font-size="21" font-weight="700" fill="#0f172a">③ 定位异常 Operator</text>
<text x="100" y="385" font-size="17" fill="#475569">队列持续积压？单 Worker 暴涨？模型副本过多？</text>
<path d="M550 410V430" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="435" width="940" height="90" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="100" y="468" font-size="21" font-weight="700" fill="#0f172a">④ 检查 Block、Batch 与长尾</text>
<text x="100" y="500" font-size="17" fill="#475569">行数不是字节上限；关注长文本、Padding 与输出膨胀</text>
<path d="M550 525V545" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="550" width="940" height="90" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="100" y="583" font-size="21" font-weight="700" fill="#0f172a">⑤ 检查并发、引用和反压</text>
<text x="100" y="615" font-size="17" fill="#475569">按每节点 / 容器核算峰值；检查物化、Actor 缓存与下游</text>
<path d="M550 640V660" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="665" width="940" height="90" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="100" y="698" font-size="21" font-weight="700" fill="#0f172a">⑥ 针对原因优化并验证</text>
<text x="100" y="730" font-size="17" fill="#475569">逐项调整；比较峰值、失败、重试、溢写与吞吐</text>
</g></svg>
