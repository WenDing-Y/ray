<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="OOM 先分层：进程、共享对象、容器与节点">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1100" height="650" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">OOM 先分层：进程、共享对象、容器与节点</text>
<rect x="35" y="90" width="1030" height="440" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="55" y="123" font-size="21" font-weight="700" fill="#0f172a">Node：所有相关进程与内存的整体压力</text>
<rect x="65" y="150" width="970" height="335" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="85" y="183" font-size="21" font-weight="700" fill="#0f172a">Ray Pod / Container：受 cgroup 与容器配置约束</text>
<rect x="95" y="220" width="420" height="100" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="115" y="253" font-size="21" font-weight="700" fill="#0f172a">Worker Heap</text>
<text x="115" y="285" font-size="17" fill="#475569">模型、Batch、Python 临时对象</text>
<rect x="555" y="220" width="450" height="100" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="575" y="253" font-size="21" font-weight="700" fill="#0f172a">Object Store</text>
<text x="575" y="285" font-size="17" fill="#475569">共享 Block；符合条件时可 Spilling</text>
<rect x="95" y="350" width="910" height="95" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="115" y="383" font-size="21" font-weight="700" fill="#0f172a">其他进程与开销</text>
<text x="115" y="415" font-size="17" fill="#475569">Raylet、运行时、系统及内存统计中的其他部分</text>
<rect x="35" y="560" width="1030" height="65" rx="12" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="55" y="593" font-size="21" font-weight="700" fill="#0f172a">这些不是独立配额：RSS 共享映射、容器和节点指标不能直接相加</text>
</g></svg>
