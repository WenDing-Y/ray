<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-label="分片恢复：持久化提交记录是完成状态的依据">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1100" height="800" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">分片恢复：持久化提交记录是完成状态的依据</text>
<rect x="160" y="90" width="780" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="180" y="123" font-size="21" font-weight="700" fill="#0f172a">① 稳定分片身份</text>
<text x="180" y="155" font-size="17" fill="#475569">输入快照 + 处理版本 + shard_id</text>
<rect x="160" y="210" width="780" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="180" y="243" font-size="21" font-weight="700" fill="#0f172a">② 查询已提交记录</text>
<text x="180" y="275" font-size="17" fill="#475569">已提交：跳过；未提交：协调并发执行，生成 attempt_id</text>
<rect x="160" y="330" width="780" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="180" y="363" font-size="21" font-weight="700" fill="#0f172a">③ 处理并写入本次尝试的独立路径</text>
<text x="180" y="395" font-size="17" fill="#475569">runs / run_id / shard_id / attempt_id；尚不对消费者发布</text>
<rect x="160" y="450" width="780" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="180" y="483" font-size="21" font-weight="700" fill="#0f172a">④ 验证输出</text>
<text x="180" y="515" font-size="17" fill="#475569">Schema、行数、坏数据、文件完整性与业务指标</text>
<rect x="160" y="570" width="780" height="85" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="180" y="603" font-size="21" font-weight="700" fill="#0f172a">⑤ 条件提交 Manifest</text>
<text x="180" y="635" font-size="17" fill="#475569">事务或条件写选择唯一胜出结果；消费者以该清单为准</text>
<path d="M550 175L550 205" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M550 295L550 325" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M550 415L550 445" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M550 535L550 565" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<rect x="160" y="690" width="780" height="75" rx="12" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="180" y="723" font-size="21" font-weight="700" fill="#0f172a">失败重跑：查询提交记录，而非猜测输出目录是否完整</text>
<path d="M550 655L550 685" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
</g></svg>
