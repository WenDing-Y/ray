<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="Ray Object Store：同节点共享、跨节点传输、内存压力下溢写磁盘">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="650" rx="18" fill="#f8fafc"/>
<g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Object Store：同节点共享，跨节点按需传输</text>
<text x="40" y="84" font-size="17" fill="#64748b">普通大型共享对象的概念示意；ObjectRef 传引用，网络传对象数据</text>
<g fill="white" stroke="#cbd5e1"><rect x="35" y="115" width="470" height="385" rx="14"/><rect x="595" y="115" width="470" height="385" rx="14"/></g>
<g font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle"><text x="270" y="153">Ray Node A</text><text x="830" y="153">Ray Node B</text></g>
<g fill="#dbeafe" stroke="#93c5fd"><rect x="65" y="180" width="190" height="65" rx="10"/><rect x="285" y="180" width="190" height="65" rx="10"/><rect x="695" y="180" width="270" height="65" rx="10"/></g>
<g font-size="20" fill="#1e40af" text-anchor="middle"><text x="160" y="219">Worker A1</text><text x="380" y="219">Worker A2</text><text x="830" y="219">Worker B1</text></g>
<g fill="#dcfce7" stroke="#86efac"><rect x="65" y="310" width="410" height="95" rx="12"/><rect x="625" y="310" width="410" height="95" rx="12"/></g>
<g font-size="21" fill="#166534" text-anchor="middle"><text x="270" y="346">Object Store A</text><text x="830" y="346">Object Store B</text></g>
<g font-size="17" fill="#166534" text-anchor="middle"><text x="270" y="378">Block X：例如 80 MB NumPy 数组</text><text x="830" y="378">Block X 的本地副本</text></g>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M160 310V245"/><path d="M380 310V245"/><path d="M830 310V245"/><path d="M475 357H625"/></g>
<g font-size="16" fill="#475569" text-anchor="middle"><text x="270" y="280">两个 Worker 可共享底层缓冲区</text><text x="830" y="280">对象就绪后从本地读取</text><text x="550" y="325">网络传输</text><text x="550" y="389">按需获取</text></g>
<g font-size="17" fill="#64748b" text-anchor="middle"><text x="270" y="445">支持的 NumPy / Arrow 缓冲区可零拷贝读</text><text x="830" y="445">已有副本可复用；跨节点仍需搬运字节</text></g>
<rect x="160" y="540" width="220" height="65" rx="10" fill="#ffedd5" stroke="#fdba74"/>
<text x="270" y="579" font-size="20" fill="#9a3412" text-anchor="middle">本地磁盘</text>
<path d="M270 405V535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="524" font-size="16" fill="#9a3412">Spilling / 按需恢复</text>
<text x="575" y="560" font-size="18" fill="#0f172a">Worker Heap 与 Object Store 分开管理</text>
<text x="575" y="592" font-size="17" fill="#64748b">溢写不解决 Python 堆或 GPU 显存 OOM</text>
</g>
</svg>
