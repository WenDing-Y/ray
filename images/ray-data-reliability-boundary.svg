<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="可靠性边界：恢复计算，不等于回滚外部写入">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1100" height="540" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">可靠性边界：恢复计算，不等于回滚外部写入</text>
<rect x="40" y="95" width="480" height="130" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="60" y="128" font-size="21" font-weight="700" fill="#0f172a">Ray 执行层</text>
<text x="60" y="160" font-size="17" fill="#475569">读取 → 清洗 → Tokenize</text>
<text x="60" y="187" font-size="17" fill="#475569">Task / Actor 在配置范围内恢复计算</text>
<rect x="580" y="95" width="480" height="130" rx="12" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="600" y="128" font-size="21" font-weight="700" fill="#0f172a">外部存储层</text>
<text x="600" y="160" font-size="17" fill="#475569">一次尝试可能已写出部分文件</text>
<text x="600" y="187" font-size="17" fill="#475569">重试不自动撤销这些文件</text>
<path d="M520 160L575 160" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<rect x="40" y="265" width="480" height="110" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="60" y="298" font-size="21" font-weight="700" fill="#0f172a">系统故障：有限重试</text>
<text x="60" y="330" font-size="17" fill="#475569">Worker 崩溃、节点丢失；关注重试预算</text>
<rect x="580" y="265" width="480" height="110" rx="12" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="600" y="298" font-size="21" font-weight="700" fill="#0f172a">业务错误：标记与隔离</text>
<text x="600" y="330" font-size="17" fill="#475569">坏数据需要诊断，重复计算通常无益</text>
<path d="M280 225L280 260" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M820 225L820 260" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
<rect x="40" y="415" width="1020" height="85" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="60" y="448" font-size="21" font-weight="700" fill="#0f172a">输出可靠性由提交协议保证</text>
<text x="60" y="480" font-size="17" fill="#475569">独立尝试路径 → 校验 → 条件提交 Manifest → 消费者只读已提交文件</text>
</g></svg>
