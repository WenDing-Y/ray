<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="组合使用：资源共用与模型服务复用是两种关系">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1100" height="660" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">组合使用：资源共用与模型服务复用是两种关系</text>
<rect x="35" y="90" width="1030" height="440" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="550.0" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Ray Cluster：统一运行时与资源调度</text>
<rect x="65" y="160" width="450" height="120" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="290.0" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Ray Data · 离线资源池</text>
<text x="290.0" y="221" text-anchor="middle" font-size="17" fill="#475569">读取 / 清洗 / 批量推理</text>
<rect x="585" y="160" width="450" height="120" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="810.0" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Ray Serve · 在线资源池</text>
<text x="810.0" y="221" text-anchor="middle" font-size="17" fill="#475569">请求路由 / Replica 推理</text>
<rect x="65" y="340" width="450" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="290.0" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">独立 vLLM / GPU 实例</text>
<text x="290.0" y="401" text-anchor="middle" font-size="17" fill="#475569">批量任务直接使用</text>
<rect x="585" y="340" width="450" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="810.0" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">服务内 vLLM / GPU 实例</text>
<text x="810.0" y="401" text-anchor="middle" font-size="17" fill="#475569">在线请求或 Data 调用使用</text>
<path d="M290 280V335" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<path d="M810 280V335" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)"/>
<path d="M515 220H580" stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="550" y="307" text-anchor="middle" font-size="16" fill="#475569">可选：Data 向 Serve 提交请求（虚线）</text>
<rect x="35" y="560" width="1030" height="75" rx="12" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="550.0" y="592" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">隔离容量、限制离线请求，避免影响在线尾延迟</text>
<text x="550.0" y="621" text-anchor="middle" font-size="17" fill="#475569">共用集群不等于共抢 GPU；实例会各自占用模型与 KV Cache 显存</text>
</g></svg>
