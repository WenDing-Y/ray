<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-label="Ray Data 配置四个 GPU Actor，由 Ray Core 分配到有可用 GPU 的节点">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1100" height="740" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">Ray Data 管数据，Ray Core 分配 GPU 资源</text>
<rect x="180" y="90" width="740" height="90" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="550" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Ray Data Executor / map_batches</text>
<text x="550" y="158" text-anchor="middle" font-size="18" fill="#475569">ActorPoolStrategy(size=4) · 每个 Actor：num_gpus=1</text>
<rect x="180" y="220" width="740" height="85" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="550" y="254" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Ray Core：检查资源与放置约束</text>
<text x="550" y="285" text-anchor="middle" font-size="17" fill="#475569">满足条件后启动 Worker，设置 GPU 可见设备</text>
<g fill="white" stroke="#cbd5e1"><rect x="35" y="365" width="320" height="230" rx="12"/><rect x="390" y="365" width="320" height="230" rx="12"/><rect x="745" y="365" width="320" height="230" rx="12"/></g>
<g font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle"><text x="195" y="403">Node A · 4 CPU / 0 GPU</text><text x="550" y="403">Node B · 8 CPU / 2 GPU</text><text x="905" y="403">Node C · 8 CPU / 2 GPU</text></g>
<g fill="#dcfce7" stroke="#86efac"><rect x="415" y="435" width="270" height="55" rx="8"/><rect x="415" y="510" width="270" height="55" rx="8"/><rect x="770" y="435" width="270" height="55" rx="8"/><rect x="770" y="510" width="270" height="55" rx="8"/></g>
<g text-anchor="middle" font-size="19" fill="#166534"><text x="550" y="469">Actor 1 · GPU 模型</text><text x="550" y="544">Actor 2 · GPU 模型</text><text x="905" y="469">Actor 3 · GPU 模型</text><text x="905" y="544">Actor 4 · GPU 模型</text></g>
<g text-anchor="middle" font-size="18" fill="#64748b"><text x="195" y="465">不满足此 GPU 请求</text><text x="195" y="500">可执行其他 CPU 工作</text></g>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"><path d="M550 180V215"/><path d="M550 305V360"/><path d="M550 305V335H905V360"/></g>
<rect x="35" y="635" width="1030" height="75" rx="12" fill="#ffedd5" stroke="#fdba74"/>
<text x="550" y="665" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">资源全可用时的示意；逻辑 GPU 申请不等于显存硬隔离</text>
<text x="550" y="695" text-anchor="middle" font-size="17" fill="#475569">每个 Actor 复用模型处理多个 Batch；用户代码仍需显式使用 CUDA。</text>
</g>
</svg>
